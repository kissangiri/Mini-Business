    function InventoryView({ inventory, setInventory, settings, showToast, openAddModal, openEditModal, openQuickStock, confirmDialog }) {
      const sym = settings.currency || "₹";
      const [search, setSearch] = useState("");
      const [selectedBrand, setSelectedBrand] = useState("ALL");
      const [selectedLine, setSelectedLine] = useState("ALL");
      const [sortBy, setSortBy] = useState("name_asc");

      // Extract unique brands and product lines
      const brands = useMemo(() => {
        const bSet = new Set(inventory.map(i => i.brand).filter(Boolean));
        return Array.from(bSet);
      }, [inventory]);

      const productLines = useMemo(() => {
        const lSet = new Set(inventory.map(i => i.productLine).filter(Boolean));
        return Array.from(lSet);
      }, [inventory]);

      // Filter & Sort
      const filteredItems = useMemo(() => {
        return inventory.filter(item => {
          const matchSearch =
            !search ||
            item.name.toLowerCase().includes(search.toLowerCase()) ||
            (item.brand && item.brand.toLowerCase().includes(search.toLowerCase())) ||
            (item.baseCode && item.baseCode.toLowerCase().includes(search.toLowerCase())) ||
            (item.productLine && item.productLine.toLowerCase().includes(search.toLowerCase()));

          const matchBrand = selectedBrand === "ALL" || item.brand === selectedBrand;
          const matchLine = selectedLine === "ALL" || item.productLine === selectedLine;

          return matchSearch && matchBrand && matchLine;
        }).sort((a, b) => {
          const stockA = calcStock(a);
          const stockB = calcStock(b);
          if (sortBy === 'stock_asc') return stockA - stockB;
          if (sortBy === 'stock_desc') return stockB - stockA;
          if (sortBy === 'price_desc') return b.sellingPrice - a.sellingPrice;
          if (sortBy === 'price_asc') return a.sellingPrice - b.sellingPrice;
          if (sortBy === 'name_desc') return b.name.localeCompare(a.name);
          return a.name.localeCompare(b.name);
        });
      }, [inventory, search, selectedBrand, selectedLine, sortBy]);

      const handleDelete = (item) => {
        confirmDialog({
          title: "Delete Inventory Item?",
          message: `Are you sure you want to remove "${item.name} (${item.brand})"? This action cannot be undone.`,
          confirmLabel: "Delete Item",
          confirmClass: "bg-rose-600 hover:bg-rose-500",
          onConfirm: () => {
            setInventory(prev => prev.filter(p => p.id !== item.id));
            showToast(`Deleted ${item.name}`);
          }
        });
      };

      return (
        <div class="space-y-4">
          {/* Header & Add Button */}
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-slate-900 border border-slate-800 p-4 rounded-2xl">
            <div>
              <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <span>Inventory Management</span>
                <span class="text-xs bg-brand-500/20 text-brand-300 px-2 py-0.5 rounded-full font-semibold">
                  {filteredItems.length} of {inventory.length}
                </span>
              </h2>
              <p class="text-xs text-slate-400">Track paint cans, boxes, bases, and hardware stock</p>
            </div>
            <button
              onClick={openAddModal}
              class="w-full sm:w-auto px-4 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-sm font-semibold flex items-center justify-center gap-2 shadow-md shadow-brand-600/30 transition active:scale-95"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>
              <span>Add New Stock</span>
            </button>
          </div>

          {/* Search, Filter & Sort Controls */}
          <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl space-y-3">
            <div class="relative">
              <svg class="w-5 h-5 absolute left-3.5 top-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
              <input
                type="text"
                placeholder="Search by product name, brand, base code, or line..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                class="w-full bg-slate-800 border border-slate-700/80 rounded-xl pl-11 pr-4 py-2.5 text-sm text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 transition"
              />
              {search && (
                <button onClick={() => setSearch('')} class="absolute right-3 top-3 text-slate-400 hover:text-white">✕</button>
              )}
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
              <div>
                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Filter Brand</label>
                <select
                  value={selectedBrand}
                  onChange={e => setSelectedBrand(e.target.value)}
                  class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-brand-500"
                >
                  <option value="ALL">All Brands ({brands.length})</option>
                  {brands.map(b => (
                    <option key={b} value={b}>{b}</option>
                  ))}
                </select>
              </div>

              <div>
                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Product Line</label>
                <select
                  value={selectedLine}
                  onChange={e => setSelectedLine(e.target.value)}
                  class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-brand-500"
                >
                  <option value="ALL">All Categories</option>
                  {productLines.map(l => (
                    <option key={l} value={l}>{l}</option>
                  ))}
                </select>
              </div>

              <div class="col-span-2 sm:col-span-1">
                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Sort Items By</label>
                <select
                  value={sortBy}
                  onChange={e => setSortBy(e.target.value)}
                  class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-white focus:outline-none focus:ring-1 focus:ring-brand-500"
                >
                  <option value="name_asc">Name: A to Z</option>
                  <option value="name_desc">Name: Z to A</option>
                  <option value="stock_asc">Stock: Lowest First</option>
                  <option value="stock_desc">Stock: Highest First</option>
                  <option value="price_desc">Price: High to Low</option>
                  <option value="price_asc">Price: Low to High</option>
                </select>
              </div>
            </div>
          </div>

          {/* Inventory Items List / Table */}
          {filteredItems.length === 0 ? (
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-10 text-center text-slate-400">
              <svg class="w-12 h-12 mx-auto text-slate-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
              <p class="text-sm font-semibold text-slate-300">No items match your filter</p>
              <button
                onClick={() => { setSearch(''); setSelectedBrand('ALL'); setSelectedLine('ALL'); }}
                class="mt-3 text-xs text-brand-400 underline font-medium"
              >
                Clear all filters
              </button>
            </div>
          ) : (
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">
              {filteredItems.map(item => {
                const totalUnits = calcStock(item);
                const thresh = Number(item.lowStockThreshold) || Number(settings.lowStockThreshold) || 5;
                const isOutOfStock = totalUnits === 0;
                const isCritical = totalUnits > 0 && totalUnits <= 2;
                const isLow = totalUnits > 2 && totalUnits <= thresh;

                return (
                  <div
                    key={item.id}
                    class="bg-slate-900 border border-slate-800 hover:border-slate-700/80 rounded-2xl p-4 flex flex-col justify-between transition shadow-sm"
                  >
                    <div>
                      {/* Top Badges */}
                      <div class="flex items-center justify-between gap-2 mb-2">
                        <span class="text-xs font-semibold px-2 py-0.5 rounded-md bg-slate-800 text-brand-400 border border-slate-700">
                          {item.brand || "Standard"}
                        </span>
                        {isOutOfStock ? (
                          <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30">
                            Out of Stock
                          </span>
                        ) : isCritical ? (
                          <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/30 animate-pulse">
                            Critical: {totalUnits} left
                          </span>
                        ) : isLow ? (
                          <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">
                            Low Stock: {totalUnits} left
                          </span>
                        ) : (
                          <span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                            In Stock
                          </span>
                        )}
                      </div>

                      {/* Product Name & Details */}
                      <h3 class="text-base font-bold text-white tracking-tight leading-snug">{item.name}</h3>
                      <div class="flex flex-wrap items-center gap-1.5 text-xs text-slate-400 mt-1 mb-3">
                        <span class="bg-slate-800/80 px-2 py-0.5 rounded text-slate-300">{item.productLine || "General"}</span>
                        <span>•</span>
                        <span class="text-sky-300 font-medium">Base: {item.baseCode || "Std"}</span>
                        <span>•</span>
                        <span>Pack: <strong>{item.packSize || item.unit}</strong></span>
                      </div>

                      {/* Stock Breakdown Box */}
                      <div class="bg-slate-850 p-2.5 rounded-xl border border-slate-800 mb-3 flex items-center justify-between">
                        <div class="text-xs">
                          <p class="text-slate-400">Box Inventory:</p>
                          <p class="font-semibold text-slate-200">
                            {item.boxes || 0} boxes <span class="text-slate-400 text-[10px]">({item.cansPerBox || 1} cans/bx)</span>
                          </p>
                        </div>
                        <div class="text-xs">
                          <p class="text-slate-400">Loose Cans:</p>
                          <p class="font-semibold text-slate-200">{item.looseCans || 0} units</p>
                        </div>
                        <div class="text-right">
                          <p class="text-[11px] text-slate-400">Total Qty:</p>
                          <p class={`text-base font-extrabold ${isOutOfStock ? 'text-rose-400' : isLow ? 'text-amber-400' : 'text-emerald-400'}`}>
                            {totalUnits}
                          </p>
                        </div>
                      </div>

                      {/* Pricing */}
                      <div class="flex items-center justify-between text-xs py-1 border-t border-slate-800/80">
                        <span class="text-slate-400">Cost: {fmt(item.costPrice, sym)}</span>
                        <span class="text-sm font-bold text-white">Rate: {fmt(item.sellingPrice, sym)}</span>
                      </div>
                    </div>

                    {/* Action Buttons */}
                    <div class="flex items-center gap-1.5 pt-3 mt-1 border-t border-slate-800/80">
                      <button
                        onClick={() => openQuickStock(item)}
                        class="flex-1 py-1.5 px-2 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 rounded-lg text-xs font-semibold flex items-center justify-center gap-1 transition"
                        title="Quick Restock"
                      >
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>
                        <span>Restock</span>
                      </button>

                      <button
                        onClick={() => openEditModal(item)}
                        class="py-1.5 px-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold transition"
                        title="Edit Item Details"
                      >
                        Edit
                      </button>

                      <button
                        onClick={() => handleDelete(item)}
                        class="py-1.5 px-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-lg text-xs font-semibold transition"
                        title="Delete Item"
                      >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    // --- 3. BILLING / POS VIEW ---
    function BillingView({ inventory, setInventory, invoices, setInvoices, settings, showToast, onBillSuccess }) {
      const sym = settings.currency || "₹";

      // Cart state
      const [cart, setCart] = useState([]);
      const [customer, setCustomer] = useState({ name: "", phone: "", address: "" });
      const [paymentMethod, setPaymentMethod] = useState(settings.defaultPaymentMethod || "UPI");
      const [amountPaid, setAmountPaid] = useState("");
      const [overallDiscount, setOverallDiscount] = useState(0);
      const [discountType, setDiscountType] = useState("flat"); // 'flat' | 'percent'
      const [enableGst, setEnableGst] = useState(settings.gstEnabled !== false);

      // Search & select item
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedBrandFilter, setSelectedBrandFilter] = useState("ALL");

      // Filter products for POS search
      const availableProducts = useMemo(() => {
        return inventory.filter(p => {
          const matchBrand = selectedBrandFilter === "ALL" || p.brand === selectedBrandFilter;
          const matchText =
            !searchQuery ||
            p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (p.brand && p.brand.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (p.baseCode && p.baseCode.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchBrand && matchText;
        });
      }, [inventory, searchQuery, selectedBrandFilter]);

      // Add product to cart
      const addToCart = (product, sellMode = "loose") => {
        const availableStock = calcStock(product);
        if (availableStock <= 0) {
          showToast(`Cannot add ${product.name}: Out of Stock!`, 'error');
          return;
        }

        const existing = cart.find(i => i.id === product.id && i.sellMode === sellMode);
        const cansPerBox = Number(product.cansPerBox) || 1;
        const requestedUnitsIfAdded = existing
          ? (sellMode === 'boxes' ? (existing.qty + 1) * cansPerBox : existing.qty + 1)
          : (sellMode === 'boxes' ? cansPerBox : 1);

        // Check against total stock considering both modes in cart
        const otherCartUnits = cart
          .filter(i => i.id === product.id && i.sellMode !== sellMode)
          .reduce((acc, i) => acc + (i.sellMode === 'boxes' ? i.qty * (Number(i.cansPerBox) || 1) : i.qty), 0);

        if (requestedUnitsIfAdded + otherCartUnits > availableStock) {
          showToast(`Cannot sell more than available stock (${availableStock} units total in stock)`, 'warning');
          return;
        }

        if (existing) {
          setCart(prev => prev.map(item =>
            (item.id === product.id && item.sellMode === sellMode)
              ? { ...item, qty: item.qty + 1 }
              : item
          ));
        } else {
          const unitRate = Number(product.sellingPrice) || 0;
          const lineRate = sellMode === 'boxes' ? unitRate * cansPerBox : unitRate;
          setCart(prev => [
            ...prev,
            {
              id: product.id,
              name: product.name,
              brand: product.brand,
              baseCode: product.baseCode,
              packSize: product.packSize,
              unit: product.unit,
              cansPerBox: cansPerBox,
              sellMode: sellMode, // 'loose' or 'boxes'
              qty: 1,
              rate: lineRate,
              lineDiscount: 0,
              gstRate: product.gstRate || settings.defaultGstRate || 18,
              hsn: product.hsn || "3209"
            }
          ]);
        }
        showToast(`Added ${product.name} (${sellMode})`);
      };

      // Cart adjustments
      const updateCartQty = (id, sellMode, newQty) => {
        if (newQty <= 0) {
          removeFromCart(id, sellMode);
          return;
        }

        const product = inventory.find(p => p.id === id);
        if (!product) return;
        const availableStock = calcStock(product);
        const cansPerBox = Number(product.cansPerBox) || 1;

        const newUnitsForThisLine = sellMode === 'boxes' ? newQty * cansPerBox : newQty;
        const otherUnits = cart
          .filter(i => i.id === id && i.sellMode !== sellMode)
          .reduce((acc, i) => acc + (i.sellMode === 'boxes' ? i.qty * (Number(i.cansPerBox) || 1) : i.qty), 0);

        if (newUnitsForThisLine + otherUnits > availableStock) {
          showToast(`Cannot exceed total available stock (${availableStock} units)`, 'warning');
          return;
        }

        setCart(prev => prev.map(item =>
          (item.id === id && item.sellMode === sellMode) ? { ...item, qty: newQty } : item
        ));
      };

      const updateCartDiscount = (id, sellMode, disc) => {
        const val = Math.max(0, Number(disc) || 0);
        setCart(prev => prev.map(item =>
          (item.id === id && item.sellMode === sellMode) ? { ...item, lineDiscount: val } : item
        ));
      };

      const removeFromCart = (id, sellMode) => {
        setCart(prev => prev.filter(i => !(i.id === id && i.sellMode === sellMode)));
      };

      // Financial calculations
      const billCalculations = useMemo(() => {
        let subtotal = 0;
        let lineDiscountTotal = 0;
        let taxableTotal = 0;
        let gstTotal = 0;

        const processedItems = cart.map(item => {
          const gross = (Number(item.qty) || 0) * (Number(item.rate) || 0);
          const disc = Number(item.lineDiscount) || 0;
          const net = Math.max(0, gross - disc);
          subtotal += gross;
          lineDiscountTotal += disc;

          // GST calculations: prices in retail paints are typically GST inclusive
          const gstPercent = enableGst ? (Number(item.gstRate) || 18) : 0;
          const taxable = enableGst ? (net / (1 + gstPercent / 100)) : net;
          const gstAmt = net - taxable;

          taxableTotal += taxable;
          gstTotal += gstAmt;

          return {
            ...item,
            gross,
            totalUnits: item.sellMode === 'boxes' ? item.qty * item.cansPerBox : item.qty,
            taxable,
            gstAmount: gstAmt,
            total: net
          };
        });

        // Overall discount
        let appliedOverallDisc = 0;
        if (discountType === 'percent') {
          appliedOverallDisc = (subtotal * (Number(overallDiscount) || 0)) / 100;
        } else {
          appliedOverallDisc = Number(overallDiscount) || 0;
        }

        const grandTotal = Math.max(0, Math.round(subtotal - lineDiscountTotal - appliedOverallDisc));

        // Cash change calculation
        const paid = Number(amountPaid) || 0;
        const changeDue = Math.max(0, paid - grandTotal);

        return {
          processedItems,
          subtotal,
          lineDiscountTotal,
          appliedOverallDisc,
          taxableTotal,
          cgst: gstTotal / 2,
          sgst: gstTotal / 2,
          grandTotal,
          changeDue
        };
      }, [cart, overallDiscount, discountType, enableGst, amountPaid]);

      // Complete Bill & Deduct Stock
      const handleCompleteBill = () => {
        if (cart.length === 0) {
          showToast("Cart is empty!", "error");
          return;
        }

        // Deduct inventory stock accurately
        const newInventory = [...inventory];
        for (const item of cart) {
          const idx = newInventory.findIndex(p => p.id === item.id);
          if (idx !== -1) {
            const prod = { ...newInventory[idx] };
            const cansPerBox = Number(prod.cansPerBox) || 1;
            let currentBoxes = Number(prod.boxes) || 0;
            let currentLoose = Number(prod.looseCans) || 0;

            if (item.sellMode === 'boxes') {
              if (currentBoxes >= item.qty) {
                currentBoxes -= item.qty;
              } else {
                // If fewer boxes than required, convert loose if possible or deduct remaining
                const remainingUnitsNeeded = (item.qty - currentBoxes) * cansPerBox;
                currentBoxes = 0;
                currentLoose = Math.max(0, currentLoose - remainingUnitsNeeded);
              }
            } else {
              // Loose sell mode
              if (currentLoose >= item.qty) {
                currentLoose -= item.qty;
              } else {
                // Break a box into loose cans
                let needed = item.qty - currentLoose;
                currentLoose = 0;
                const boxesToBreak = Math.ceil(needed / cansPerBox);
                currentBoxes = Math.max(0, currentBoxes - boxesToBreak);
                const gainedLoose = boxesToBreak * cansPerBox;
                currentLoose = (gainedLoose - needed);
              }
            }
            prod.boxes = currentBoxes;
            prod.looseCans = currentLoose;
            newInventory[idx] = prod;
          }
        }

        // Generate Invoice
        const now = new Date();
        const dateStr = now.toISOString().split('T')[0];
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const invId = `${settings.invoicePrefix || 'INV-'}${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2, '0')}${now.getDate().toString().padStart(2, '0')}-${(invoices.length + 1001)}`;

        const newInvoice = {
          id: invId,
          date: dateStr,
          time: timeStr,
          customer: {
            name: customer.name.trim() || "Cash Customer",
            phone: customer.phone.trim(),
            address: customer.address.trim()
          },
          items: billCalculations.processedItems,
          subtotal: billCalculations.subtotal,
          overallDiscount: billCalculations.appliedOverallDisc + billCalculations.lineDiscountTotal,
          taxableAmount: billCalculations.taxableTotal,
          cgst: billCalculations.cgst,
          sgst: billCalculations.sgst,
          grandTotal: billCalculations.grandTotal,
          paymentMethod: paymentMethod,
          amountPaid: Number(amountPaid) || billCalculations.grandTotal,
          change: billCalculations.changeDue,
          status: "Completed"
        };

        // Update state
        setInventory(newInventory);
        setInvoices(prev => [newInvoice, ...prev]);

        // Reset cart
        setCart([]);
        setCustomer({ name: "", phone: "", address: "" });
        setAmountPaid("");
        setOverallDiscount(0);

        showToast(`Bill #${invId} created successfully!`, 'success');
        onBillSuccess(newInvoice);
      };

      return (
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
          {/* LEFT: Product Catalog / Picker (7 Cols on large screens) */}
          <div class="lg:col-span-7 space-y-3.5">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
              <h2 class="text-base font-bold text-white mb-2 flex items-center justify-between">
                <span>Select Products</span>
                <span class="text-xs text-slate-400 font-normal">Click to add to bill</span>
              </h2>

              {/* Search & Brand Filter */}
              <div class="flex flex-col sm:flex-row gap-2 mb-3">
                <div class="relative flex-1">
                  <svg class="w-4 h-4 absolute left-3 top-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                  <input
                    type="text"
                    placeholder="Search paint, shade, brand..."
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-9 pr-3 py-2 text-xs text-white focus:outline-none focus:ring-1 focus:ring-brand-500"
                  />
                </div>
                <select
                  value={selectedBrandFilter}
                  onChange={e => setSelectedBrandFilter(e.target.value)}
                  class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                >
                  <option value="ALL">All Brands</option>
                  {['Asian Paints', 'Berger', 'Nerolac', 'Pidilite', 'Astral', 'Dulux'].map(b => (
                    <option key={b} value={b}>{b}</option>
                  ))}
                </select>
              </div>

              {/* Product Grid */}
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 max-h-[520px] overflow-y-auto pr-1 no-scrollbar">
                {availableProducts.map(prod => {
                  const stock = calcStock(prod);
                  const isOut = stock <= 0;
                  return (
                    <div
                      key={prod.id}
                      class={`p-3 rounded-xl border transition flex flex-col justify-between ${
                        isOut ? 'bg-slate-900/60 border-slate-800/50 opacity-60' : 'bg-slate-850 hover:bg-slate-800 border-slate-700/80 shadow-sm'
                      }`}
                    >
                      <div>
                        <div class="flex items-center justify-between text-[11px] mb-1">
                          <span class="font-semibold text-brand-400">{prod.brand}</span>
                          <span class={`font-bold ${isOut ? 'text-rose-400' : 'text-emerald-400'}`}>
                            {isOut ? 'Out of stock' : `${stock} left`}
                          </span>
                        </div>
                        <h4 class="text-xs font-bold text-white leading-tight line-clamp-1">{prod.name}</h4>
                        <p class="text-[11px] text-slate-400 mt-0.5">
                          Base: <span class="text-sky-300 font-medium">{prod.baseCode || "Std"}</span> • Pack: {prod.packSize}
                        </p>
                        <p class="text-sm font-extrabold text-white mt-1.5">{fmt(prod.sellingPrice, sym)}</p>
                      </div>

                      {/* Selling Mode Buttons */}
                      <div class="flex gap-1.5 mt-2.5 pt-2 border-t border-slate-800">
                        <button
                          disabled={isOut}
                          onClick={() => addToCart(prod, 'loose')}
                          class="flex-1 py-1 px-1.5 bg-brand-600 hover:bg-brand-500 disabled:bg-slate-800 disabled:text-slate-600 text-white text-[11px] font-semibold rounded-lg transition"
                        >
                          + 1 Can
                        </button>
                        {prod.cansPerBox > 1 && (
                          <button
                            disabled={isOut || (prod.boxes <= 0 && stock < prod.cansPerBox)}
                            onClick={() => addToCart(prod, 'boxes')}
                            class="flex-1 py-1 px-1.5 bg-slate-700 hover:bg-slate-600 disabled:bg-slate-800 disabled:text-slate-600 text-slate-200 text-[11px] font-semibold rounded-lg transition"
                            title={`Add 1 box containing ${prod.cansPerBox} cans`}
                          >
                            + Box ({prod.cansPerBox})
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* RIGHT: Current Cart & Invoice Summary (5 Cols on large screens) */}
          <div class="lg:col-span-5 space-y-4">
            {/* Customer Details Box */}
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
              <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2.5">Customer Information</h3>
              <div class="grid grid-cols-2 gap-2 text-xs">
                <input
                  type="text"
                  placeholder="Customer Name"
                  value={customer.name}
                  onChange={e => setCustomer({ ...customer, name: e.target.value })}
                  class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
                />
                <input
                  type="tel"
                  placeholder="Phone (10 digits)"
                  value={customer.phone}
                  onChange={e => setCustomer({ ...customer, phone: e.target.value })}
                  class="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-brand-500"
                />
              </div>
            </div>

            {/* Cart Table */}
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
              <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-bold text-white flex items-center gap-1.5">
                  <span>Current Bill</span>
                  <span class="text-xs bg-brand-600/30 text-brand-300 px-2 py-0.5 rounded-full font-semibold">
                    {cart.length} item(s)
                  </span>
                </h3>
                {cart.length > 0 && (
                  <button
                    onClick={() => setCart([])}
                    class="text-[11px] text-rose-400 hover:text-rose-300 font-semibold"
                  >
                    Clear Bill
                  </button>
                )}
              </div>

              {cart.length === 0 ? (
                <div class="text-center py-8 text-slate-500 text-xs">
                  <p>Cart is empty.</p>
                  <p class="mt-1 text-slate-600">Click products on the left to add items to this bill.</p>
                </div>
              ) : (
                <div class="space-y-2.5 max-h-64 overflow-y-auto pr-1 no-scrollbar">
                  {cart.map(item => (
                    <div key={`${item.id}_${item.sellMode}`} class="bg-slate-850 p-2.5 rounded-xl border border-slate-800 text-xs">
                      <div class="flex justify-between items-start">
                        <div class="flex-1 pr-2">
                          <p class="font-bold text-white leading-tight">{item.name}</p>
                          <p class="text-[11px] text-slate-400 mt-0.5">
                            {item.brand} • {item.baseCode} • <strong class="text-sky-300 font-semibold">{item.sellMode === 'boxes' ? `Box of ${item.cansPerBox}` : 'Loose Can'}</strong>
                          </p>
                        </div>
                        <button
                          onClick={() => removeFromCart(item.id, item.sellMode)}
                          class="text-slate-500 hover:text-rose-400 p-1"
                        >
                          ✕
                        </button>
                      </div>

                      <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-800/80">
                        {/* Qty controls */}
                        <div class="flex items-center gap-1.5">
                          <button
                            onClick={() => updateCartQty(item.id, item.sellMode, item.qty - 1)}
                            class="w-6 h-6 rounded bg-slate-800 text-slate-300 flex items-center justify-center font-bold hover:bg-slate-700"
                          >
                            -
                          </button>
                          <span class="w-7 text-center font-bold text-white text-xs">{item.qty}</span>
                          <button
                            onClick={() => updateCartQty(item.id, item.sellMode, item.qty + 1)}
                            class="w-6 h-6 rounded bg-slate-800 text-slate-300 flex items-center justify-center font-bold hover:bg-slate-700"
                          >
                            +
                          </button>
                        </div>

                        {/* Line rate and total */}
                        <div class="text-right">
                          <p class="text-[10px] text-slate-400">@ {fmt(item.rate, sym)}</p>
                          <p class="font-bold text-emerald-400 text-xs">{fmt(item.qty * item.rate, sym)}</p>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* Bill Totals & Discount */}
              {cart.length > 0 && (
                <div class="mt-4 pt-3 border-t border-slate-800 space-y-2 text-xs">
                  <div class="flex justify-between text-slate-300">
                    <span>Subtotal:</span>
                    <span class="font-semibold">{fmt(billCalculations.subtotal, sym)}</span>
                  </div>

                  {/* Discount input */}
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-slate-400">Discount:</span>
                    <div class="flex items-center gap-1">
                      <select
                        value={discountType}
                        onChange={e => setDiscountType(e.target.value)}
                        class="bg-slate-800 text-slate-300 border border-slate-700 rounded px-1 py-0.5 text-[11px]"
                      >
                        <option value="flat">₹ Flat</option>
                        <option value="percent">% Off</option>
                      </select>
                      <input
                        type="number"
                        min="0"
                        value={overallDiscount}
                        onChange={e => setOverallDiscount(e.target.value)}
                        class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-0.5 text-right text-white text-xs"
                      />
                    </div>
                  </div>

                  {/* GST breakdown toggle */}
                  <div class="flex items-center justify-between text-slate-400">
                    <label class="flex items-center gap-1.5 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={enableGst}
                        onChange={e => setEnableGst(e.target.checked)}
                        class="rounded bg-slate-800 border-slate-700 text-brand-600 focus:ring-0"
                      />
                      <span>Include GST (CGST+SGST)</span>
                    </label>
                    {enableGst && (
                      <span class="text-[11px] text-slate-400">
                        Tax: {fmt(billCalculations.cgst + billCalculations.sgst, sym)}

    function ItemEditModal({ mode, item, settings, onClose, onSave }) {

        name: item?.name || "",
        brand: item?.brand || "Asian Paints",
        productLine: item?.productLine || "Interior Paint",
        baseCode: item?.baseCode || "",
        unit: item?.unit || "Liters",
        packSize: item?.packSize || "1 L",
        cansPerBox: item?.cansPerBox !== undefined ? item.cansPerBox : 4,
        boxes: item?.boxes !== undefined ? item.boxes : 0,
        looseCans: item?.looseCans !== undefined ? item.looseCans : 0,
        costPrice: item?.costPrice !== undefined ? item.costPrice : "",
        sellingPrice: item?.sellingPrice !== undefined ? item.sellingPrice : "",
        lowStockThreshold: item?.lowStockThreshold !== undefined ? item.lowStockThreshold : (settings.lowStockThreshold || 5),
        hsn: item?.hsn || "3209",
        gstRate: item?.gstRate !== undefined ? item.gstRate : 18
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!form.name.trim()) return;
        onSave({
          ...form,
          cansPerBox: Math.max(1, Number(form.cansPerBox) || 1),
          boxes: Math.max(0, Number(form.boxes) || 0),
          looseCans: Math.max(0, Number(form.looseCans) || 0),
          costPrice: Math.max(0, Number(form.costPrice) || 0),
          sellingPrice: Math.max(0, Number(form.sellingPrice) || 0),
          lowStockThreshold: Math.max(1, Number(form.lowStockThreshold) || 5),
          gstRate: Number(form.gstRate) || 18
        });
      };

      return (
        <div class="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/80 backdrop-blur-sm overflow-y-auto">
          <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden my-6">

                />
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block font-semibold text-slate-300 mb-1">Brand *</label>

                    type="text"

                    placeholder="Asian Paints / Berger / Astral"

                    onChange={e => setForm({ ...form, brand: e.target.value })}

                  />
                </div>
                <div>
                  <label class="block font-semibold text-slate-300 mb-1">Product Line / Category</label>

                    onChange={e => setForm({ ...form, productLine: e.target.value })}

                  />
                </div>
              </div>

              <div class="grid grid-cols-3 gap-2.5">
                <div>
                  <label class="block font-semibold text-slate-300 mb-1">Base / Shade Code</label>

                    type="text"

                    onChange={e => setForm({ ...form, baseCode: e.target.value })}

                  >
                    <option value="Liters">Liters</option>
                    <option value="Milliliters">Milliliters</option>
                    <option value="Kilograms">Kilograms</option>
                    <option value="Pieces">Pieces</option>
                    <option value="Meters">Meters</option>
                  </select>

                      value={form.looseCans}
                      onChange={e => setForm({ ...form, looseCans: e.target.value })}
                      class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white"
                    />
                  </div>
                </div>
                <p class="text-[11px] text-brand-400 text-right">
                  Total Units: <strong>{(Number(form.boxes) || 0) * (Number(form.cansPerBox) || 1) + (Number(form.looseCans) || 0)}</strong>
                </p>
              </div>

              {/* Pricing & Tax */}
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                <div>
                  <label class="block font-semibold text-slate-300 mb-1">Cost Price (₹)</label>
                  <input
                    type="number"
                    min="0"
                    placeholder="Cost"
                    value={form.costPrice}
                    onChange={e => setForm({ ...form, costPrice: e.target.value })}
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2 text-white"
                  />
                </div>
                <div>
                  <label class="block font-semibold text-slate-300 mb-1">Selling Rate *</label>
                  <input
                    type="number"
                    min="0"
                    required
                    placeholder="Rate"
                    value={form.sellingPrice}
                    onChange={e => setForm({ ...form, sellingPrice: e.target.value })}
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2 text-white font-bold text-emerald-400"
                  />
                </div>
                <div>
                  <label class="block font-semibold text-slate-300 mb-1">HSN Code</label>
                  <input
                    type="text"
                    placeholder="3209"
                    value={form.hsn}
                    onChange={e => setForm({ ...form, hsn: e.target.value })}
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2 text-white"
                  />
                </div>
                <div>
                  <label class="block font-semibold text-slate-300 mb-1">GST Rate %</label>
                  <select
                    value={form.gstRate}
                    onChange={e => setForm({ ...form, gstRate: Number(e.target.value) })}
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2 py-2 text-white"
                  >
                    <option value={18}>18% (Paint standard)</option>
                    <option value={28}>28% (Luxury)</option>
                    <option value={12}>12% (Hardware/Tools)</option>
                    <option value={5}>5%</option>
                    <option value={0}>0% (Exempt)</option>
                  </select>
                </div>
              </div>

              <div>
                <label class="block font-semibold text-slate-300 mb-1">Low Stock Warning Threshold (Units)</label>
                <input
                  type="number"
                  min="1"
                  value={form.lowStockThreshold}
                  onChange={e => setForm({ ...form, lowStockThreshold: e.target.value })}
                  class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white"
                />
              </div>

              <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
                <button
                  type="button"
                  onClick={onClose}
                  class="px-4 py-2 bg-slate-800 hover:bg-slate-750 text-slate-300 rounded-xl font-semibold transition"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  class="px-5 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-bold shadow-md shadow-brand-600/30 transition active:scale-95"
                >
                  {mode === 'add' ? 'Add Product' : 'Save Changes'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- 9. QUICK RESTOCK MODAL ---
    function QuickStockModal({ item, onClose, onSave }) {
      const [addBoxes, setAddBoxes] = useState(0);
      const [addLoose, setAddLoose] = useState(0);
      const [note, setNote] = useState("");

      const currentTotal = calcStock(item);
      const newTotal = currentTotal + (Number(addBoxes) * (Number(item.cansPerBox) || 1)) + Number(addLoose);

      return (
        <div class="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/80 backdrop-blur-sm">
          <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl shadow-2xl p-5 space-y-4">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="text-sm font-bold text-white">Quick Restock</h3>
                <p class="text-xs text-brand-400 font-medium">{item.name} ({item.brand})</p>
                <p class="text-[11px] text-slate-400">Current in stock: {currentTotal} units</p>
              </div>
              <button onClick={onClose} class="text-slate-400 hover:text-white">✕</button>
            </div>

            <div class="space-y-3 text-xs">
              <div>
                <label class="block font-semibold text-slate-300 mb-1">
                  Add Boxes (+{item.cansPerBox || 1} cans/box)
                </label>
                <div class="flex items-center gap-2">
                  {[1, 2, 5, 10].map(cnt => (
                    <button
                      key={cnt}
                      type="button"
                      onClick={() => setAddBoxes(cnt)}
                      class="px-2 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-semibold"
                    >
                      +{cnt}
                    </button>
                  ))}
                  <input
                    type="number"
                    min="0"
                    value={addBoxes}
                    onChange={e => setAddBoxes(Math.max(0, Number(e.target.value) || 0))}
                    class="w-16 bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-white text-center ml-auto"
                  />
                </div>
              </div>

              <div>
                <label class="block font-semibold text-slate-300 mb-1">Add Loose Cans / Units</label>
                <div class="flex items-center gap-2">
                  {[1, 2, 4, 8].map(cnt => (
                    <button
                      key={cnt}
                      type="button"
                      onClick={() => setAddLoose(cnt)}
                      class="px-2 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-semibold"
                    >
                      +{cnt}
                    </button>
                  ))}
                  <input
                    type="number"
                    min="0"
                    value={addLoose}
                    onChange={e => setAddLoose(Math.max(0, Number(e.target.value) || 0))}
                    class="w-16 bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-white text-center ml-auto"
                  />
                </div>
              </div>

              <div class="bg-slate-850 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                <span class="text-slate-400">Resulting Total Stock:</span>
                <span class="text-base font-extrabold text-emerald-400">{newTotal} units</span>
              </div>
            </div>

            <div class="flex gap-2 pt-2">
              <button
                type="button"
                onClick={onClose}
                class="flex-1 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold"
              >
                Cancel
              </button>
              <button
                type="button"
                onClick={() => onSave(addBoxes, addLoose, note)}
                class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold shadow-md shadow-emerald-600/30"
              >
                Update Stock
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- 10. PROFESSIONAL INDIAN RETAIL INVOICE MODAL & PRINT VIEW ---
    function InvoiceModal({ invoice, settings, onClose, onPrint }) {
      const sym = settings.currency || "₹";
      const [printFormat, setPrintFormat] = useState("a4"); // 'a4' or 'thermal'

      if (!invoice) return null;

      return (
        <div class="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-black/80 backdrop-blur-sm overflow-y-auto">
          <div class="bg-slate-900 border border-slate-800 w-full max-w-2xl rounded-2xl shadow-2xl flex flex-col max-h-[92vh]">
            {/* Header controls (no-print) */}
            <div class="no-print px-4 py-3 border-b border-slate-800 flex items-center justify-between bg-slate-850 rounded-t-2xl">
              <div class="flex items-center gap-3">
                <h3 class="text-sm font-bold text-white">Invoice #{invoice.id}</h3>
                <div class="flex bg-slate-800 p-0.5 rounded-lg border border-slate-700">
                  <button
                    onClick={() => setPrintFormat('a4')}
                    class={`px-2.5 py-1 rounded text-xs font-semibold ${printFormat === 'a4' ? 'bg-brand-600 text-white' : 'text-slate-400'}`}
                  >
                    A4 Invoice
                  </button>
                  <button
                    onClick={() => setPrintFormat('thermal')}
                    class={`px-2.5 py-1 rounded text-xs font-semibold ${printFormat === 'thermal' ? 'bg-brand-600 text-white' : 'text-slate-400'}`}
                  >
                    Thermal Receipt
                  </button>
                </div>
              </div>

              <div class="flex items-center gap-2">
                <button
                  onClick={onPrint}
                  class="px-3.5 py-1.5 bg-brand-600 hover:bg-brand-500 text-white rounded-lg text-xs font-bold flex items-center gap-1.5 shadow-md shadow-brand-600/30"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
                  <span>Print Bill</span>
                </button>
                <button onClick={onClose} class="text-slate-400 hover:text-white p-1 text-base">✕</button>
              </div>
            </div>

            {/* Printable Content Area */}
            <div class="flex-1 overflow-y-auto p-4 sm:p-6 bg-white text-slate-900 rounded-b-2xl font-sans" id="printable-invoice-area">
              {printFormat === 'a4' ? (
                /* --- A4 PROFESSIONAL TAX INVOICE FORMAT --- */
                <div class="max-w-2xl mx-auto border border-gray-300 p-6 rounded-lg text-xs space-y-4">
                  {/* Top Store Header */}
                  <div class="text-center border-b border-gray-200 pb-3">
                    <h1 class="text-xl font-black uppercase tracking-wide text-gray-900">{settings.storeName}</h1>
                    <p class="text-xs font-medium text-gray-600">{settings.tagline}</p>
                    <p class="text-[11px] text-gray-500 mt-0.5">{settings.address}, {settings.cityState}</p>
                    <p class="text-[11px] text-gray-500">
                      <strong>Phone:</strong> {settings.phone} | <strong>Email:</strong> {settings.email}
                    </p>
                    {settings.gstin && (
                      <p class="text-xs font-bold text-gray-800 mt-1">
                        GSTIN / UIN: <span class="font-mono">{settings.gstin}</span>
                      </p>
                    )}
                    <span class="inline-block px-3 py-0.5 mt-1.5 bg-gray-100 border border-gray-300 text-[10px] font-bold uppercase rounded">
                      TAX INVOICE / RETAIL BILL
                    </span>
                  </div>

                  {/* Invoice & Customer Meta */}
                  <div class="grid grid-cols-2 gap-4 border-b border-gray-200 pb-3 text-xs">
                    <div>
                      <p class="font-bold text-gray-700 uppercase text-[10px]">Billed To (Customer):</p>
                      <p class="text-sm font-bold text-gray-900 mt-0.5">{invoice.customer?.name || "Cash Customer"}</p>
                      {invoice.customer?.phone && <p class="text-gray-600">Mob: {invoice.customer.phone}</p>}
                      {invoice.customer?.address && <p class="text-gray-600">{invoice.customer.address}</p>}
                    </div>

                    <div class="text-right">
                      <p><span class="font-semibold text-gray-600">Invoice No:</span> <strong class="font-mono">{invoice.id}</strong></p>
                      <p><span class="font-semibold text-gray-600">Date:</span> {invoice.date}</p>
                      <p><span class="font-semibold text-gray-600">Time:</span> {invoice.time}</p>
                      <p><span class="font-semibold text-gray-600">Payment:</span> <strong class="uppercase">{invoice.paymentMethod}</strong></p>
                    </div>
                  </div>

                  {/* Items Table */}
                  <table class="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr class="bg-gray-100 border-y border-gray-300 text-[11px] font-bold text-gray-700">
                        <th class="py-1.5 px-2">#</th>
                        <th class="py-1.5 px-2">Item Description & Brand</th>
                        <th class="py-1.5 px-2">Base</th>
                        <th class="py-1.5 px-2 text-center">Qty / Pkg</th>
                        <th class="py-1.5 px-2 text-right">Rate</th>
                        <th class="py-1.5 px-2 text-right">Total</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                      {invoice.items?.map((item, idx) => (
                        <tr key={idx} class="hover:bg-gray-50">
                          <td class="py-2 px-2 text-gray-500">{idx + 1}</td>
                          <td class="py-2 px-2">
                            <span class="font-bold text-gray-900">{item.name}</span>
                            <span class="block text-[10px] text-gray-500">{item.brand} • Pack: {item.packSize}</span>
                          </td>
                          <td class="py-2 px-2 text-gray-600 font-mono text-[11px]">{item.baseCode || "Std"}</td>
                          <td class="py-2 px-2 text-center">
                            <strong>{item.qty}</strong> {item.sellMode === 'boxes' ? `box (${item.cansPerBox} cans)` : 'can'}
                          </td>
                          <td class="py-2 px-2 text-right text-gray-700">{fmt(item.rate, sym)}</td>
                          <td class="py-2 px-2 text-right font-bold text-gray-900">{fmt(item.total, sym)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  {/* Summary & Tax Breakdown */}
                  <div class="border-t-2 border-gray-300 pt-3 flex justify-between items-start text-xs">
                    <div class="space-y-1 text-gray-500 text-[11px] max-w-xs">
                      {invoice.taxableAmount > 0 && (
                        <div class="bg-gray-50 p-2 rounded border border-gray-200 space-y-0.5">
                          <p class="font-bold text-gray-700 text-[10px] uppercase">GST Breakdown (Included)</p>
                          <div class="flex justify-between">
                            <span>Taxable Value:</span>
                            <span>{fmt(invoice.taxableAmount, sym)}</span>
                          </div>
                          <div class="flex justify-between">
                            <span>CGST (9%):</span>
                            <span>{fmt(invoice.cgst, sym)}</span>
                          </div>
                          <div class="flex justify-between">
                            <span>SGST (9%):</span>
                            <span>{fmt(invoice.sgst, sym)}</span>
                          </div>
                        </div>
                      )}
                      <p class="pt-1 italic">Authorized Signatory Stamp</p>
                    </div>

                    <div class="w-56 space-y-1.5 text-right">
                      <div class="flex justify-between text-gray-600">
                        <span>Items Subtotal:</span>
                        <span>{fmt(invoice.subtotal, sym)}</span>
                      </div>
                      {invoice.overallDiscount > 0 && (
                        <div class="flex justify-between text-amber-700">
                          <span>Discount:</span>
                          <span>- {fmt(invoice.overallDiscount, sym)}</span>
                        </div>
                      )}
                      <div class="flex justify-between items-center text-sm font-extrabold text-gray-900 pt-1.5 border-t border-gray-300">
                        <span>Grand Total:</span>
                        <span class="text-base">{fmt(invoice.grandTotal, sym)}</span>
                      </div>
                      {invoice.amountPaid !== undefined && (
                        <div class="text-[11px] text-gray-500 pt-1">
                          <p>Paid: {fmt(invoice.amountPaid, sym)} | Change: {fmt(invoice.change, sym)}</p>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Footer Terms */}
                  <div class="border-t border-gray-200 pt-3 text-[10px] text-gray-500 text-center space-y-0.5">
                    <p class="font-medium text-gray-700">{settings.footerNote}</p>
                    <p class="font-bold text-gray-900 uppercase">Thank you for your business! Visit Again.</p>
                  </div>
                </div>
              ) : (
                /* --- THERMAL RECEIPT 80MM FORMAT --- */
                <div class="max-w-xs mx-auto border-x border-dashed border-gray-300 p-4 text-[11px] font-mono space-y-2 bg-gray-50">
                  <div class="text-center border-b border-dashed border-gray-300 pb-2">
                    <h2 class="text-sm font-black uppercase">{settings.storeName}</h2>
                    <p class="text-[10px] text-gray-600">{settings.address}</p>
                    <p class="text-[10px] text-gray-600">Mob: {settings.phone}</p>
                    {settings.gstin && <p class="text-[10px]">GSTIN: {settings.gstin}</p>}
                  </div>

                  <div class="text-[10px] border-b border-dashed border-gray-300 pb-1.5 space-y-0.5">
                    <p>Bill: {invoice.id}</p>
                    <p>Date: {invoice.date} {invoice.time}</p>
                    <p>Cust: {invoice.customer?.name || "Walk-in"}</p>
                  </div>

                  <div class="space-y-1 border-b border-dashed border-gray-300 pb-2">
                    {invoice.items?.map((it, i) => (
                      <div key={i} class="flex justify-between items-start">
                        <div class="pr-1">
                          <p class="font-bold">{it.name}</p>
                          <p class="text-[9px] text-gray-500">{it.qty} x {it.rate} ({it.sellMode})</p>
                        </div>
                        <span class="font-bold">{fmt(it.total, sym)}</span>
                      </div>
                    ))}
                  </div>

                  <div class="space-y-1 font-bold pt-1">
                    <div class="flex justify-between text-xs font-black">
                      <span>TOTAL:</span>
                      <span>{fmt(invoice.grandTotal, sym)}</span>
                    </div>
                    <div class="flex justify-between text-[10px] text-gray-600 font-normal">
                      <span>Paid ({invoice.paymentMethod}):</span>
                      <span>{fmt(invoice.amountPaid || invoice.grandTotal, sym)}</span>
                    </div>
                    {invoice.change > 0 && (
                      <div class="flex justify-between text-[10px] text-gray-600 font-normal">
                        <span>Change:</span>
                        <span>{fmt(invoice.change, sym)}</span>
                      </div>
                    )}
                  </div>

                  <div class="text-center border-t border-dashed border-gray-300 pt-2 text-[9px] text-gray-500">
                    <p>Thank You!</p>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- 11. CONFIRMATION DIALOG MODAL ---
    function ConfirmModal({ title, message, confirmLabel, confirmClass, onConfirm, onCancel }) {
      return (
        <div class="fixed inset-0 z-50 flex items-center justify-center p-3 bg-black/80 backdrop-blur-sm">
          <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl shadow-2xl p-5 space-y-4">
            <h3 class="text-sm font-bold text-white">{title || "Confirm Action"}</h3>
            <p class="text-xs text-slate-300 leading-relaxed">{message}</p>
            <div class="flex justify-end gap-2 pt-2">
              <button
                type="button"
                onClick={onCancel}
                class="px-4 py-2 bg-slate-800 hover:bg-slate-750 text-slate-300 rounded-xl text-xs font-semibold"
              >
                Cancel
              </button>
              <button
                type="button"
                onClick={onConfirm}
                class={`px-4 py-2 text-white rounded-xl text-xs font-bold shadow-md transition ${confirmClass || 'bg-brand-600 hover:bg-brand-500'}`}
              >
                {confirmLabel || "Confirm"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Mount Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
