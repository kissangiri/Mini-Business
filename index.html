<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Goods Manage – Paint & Hardware POS</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            },
            slate: {
              850: '#151e2e',
              900: '#0f172a',
              950: '#090d16',
            }
          }
        }
      }
    }
  </script>
  <!-- React 18 and Babel for JSX in standalone HTML -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @media print {
      body * {
        visibility: hidden !important;
      }
      #printable-invoice-area, #printable-invoice-area * {
        visibility: visible !important;
      }
      #printable-invoice-area {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
    }
    /* Hide scrollbars on mobile nav */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen select-none md:select-auto">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- DEFAULT INITIAL STORE DATA ---
    const DEFAULT_SETTINGS = {
      storeName: "Apex Paint & Hardware Mart",
      tagline: "Authorized Dealers: Asian Paints, Berger, Nerolac & Astral",
      address: "Shop #4, Market Yard Main Road, Near Old Bus Stand",
      cityState: "Pune, Maharashtra - 411037",
      phone: "+91 98220 12345",
      email: "contact@apexpainthw.com",
      gstin: "27AABCU9603R1ZM",
      ownerName: "Balram Giri",
      lowStockThreshold: 5,
      defaultPaymentMethod: "UPI",
      defaultGstRate: 18,
      gstEnabled: true,
      currency: "₹",
      invoicePrefix: "APX-",
      footerNote: "Goods once sold can be returned within 7 days with original bill in sealed condition. Tinted paints are non-refundable."
    };

    const INITIAL_INVENTORY = [
      {
        id: "p1",
        name: "Royale Luxury Emulsion",
        brand: "Asian Paints",

        unit: "Liters",
        packSize: "20 L",
        cansPerBox: 1,
        boxes: 4,

      },
      {
        id: "p3",

        brand: "Nerolac",
        productLine: "Interior Emulsion",
        baseCode: "Base-01",
        unit: "Liters",
        packSize: "1 L",
        cansPerBox: 12,
        boxes: 2,

        gstRate: 18
      },
      {
        id: "p4",
        name: "TruCare Interior Wall Primer",
        brand: "Asian Paints",
        productLine: "Primer / Undercoat",
        baseCode: "Water Based",
        unit: "Liters",
        packSize: "10 L",
        cansPerBox: 2,
        boxes: 8,
        looseCans: 1,
        costPrice: 850,
        sellingPrice: 1100,
        lowStockThreshold: 4,
        hsn: "3208",
        gstRate: 18
      },
      {
        id: "p5",
        name: "Dr. Fixit 101 LW+ Waterproofing",
        brand: "Pidilite",
        productLine: "Waterproofing",
        baseCode: "Chemical Additive",
        unit: "Liters",
        packSize: "5 L",
        cansPerBox: 4,
        boxes: 1,
        looseCans: 1, // 5 units total -> low stock!
        costPrice: 420,
        sellingPrice: 560,
        lowStockThreshold: 8,
        hsn: "3824",
        gstRate: 18
      },
      {
        id: "p6",
        name: "Apcolite Premium Gloss Enamel",
        brand: "Asian Paints",
        productLine: "Enamel / Metal",
        baseCode: "Signal Red (024)",
        unit: "Liters",
        packSize: "500 ml",
        cansPerBox: 12,
        boxes: 0,
        looseCans: 1, // Critical stock!
        costPrice: 130,
        sellingPrice: 175,
        lowStockThreshold: 6,
        hsn: "3208",
        gstRate: 18
      },
      {
        id: "p7",
        name: "CPVC Pipe SDR 11 Class 1",
        brand: "Astral",
        productLine: "Plumbing & Hardware",
        baseCode: '1" (3 Meter length)',
        unit: "Pieces",
        packSize: "Piece",
        cansPerBox: 10,
        boxes: 6,
        looseCans: 4,
        costPrice: 290,
        sellingPrice: 380,
        lowStockThreshold: 10,
        hsn: "3917",
        gstRate: 18
      },
      {
        id: "p8",
        name: "Paint Roller 9 Inch Foam & Fabric",
        brand: "Asian Paints",
        productLine: "Painting Tools",
        baseCode: "Heavy Duty Cage",
        unit: "Pieces",
        packSize: "Piece",
        cansPerBox: 20,
        boxes: 0,
        looseCans: 0, // OUT OF STOCK
        costPrice: 120,
        sellingPrice: 190,
        lowStockThreshold: 5,
        hsn: "9603",
        gstRate: 12
      }
    ];

    const INITIAL_INVOICES = [
      {
        id: "APX-20260925-1001",
        date: new Date().toISOString().split('T')[0],
        time: "10:15 AM",
        customer: {
          name: "Suresh Patil",
          phone: "9876543210",
          address: "Bungalow #12, Orchid Enclave"
        },
        items: [
          {
            id: "p1",
            name: "Royale Luxury Emulsion",
            brand: "Asian Paints",
            baseCode: "Base White (001)",
            packSize: "4 L",
            unit: "Liters",
            sellMode: "boxes",
            qty: 2,
            cansPerBox: 4,
            totalUnits: 8,
            rate: 7400, // 2 boxes * 4 cans * 1850 / box or box price
            lineDiscount: 200,
            gstRate: 18,
            taxable: 6101.69,
            gstAmount: 1098.31,
            total: 7200
          },
          {
            id: "p4",
            name: "TruCare Interior Wall Primer",
            brand: "Asian Paints",
            baseCode: "Water Based",
            packSize: "10 L",
            unit: "Liters",
            sellMode: "loose",
            qty: 2,
            cansPerBox: 2,
            totalUnits: 2,
            rate: 1100,
            lineDiscount: 0,
            gstRate: 18,
            taxable: 1864.41,
            gstAmount: 335.59,
            total: 2200
          }
        ],
        subtotal: 9600,
        overallDiscount: 200,
        taxableAmount: 7966.10,
        cgst: 716.95,
        sgst: 716.95,
        grandTotal: 9400,
        paymentMethod: "UPI",
        amountPaid: 9400,
        change: 0,
        status: "Completed"
      }
    ];

    // Helper: calculate total units in stock for an item
    const calcStock = (item) => {
      const boxes = Number(item.boxes) || 0;
      const loose = Number(item.looseCans) || 0;
      const perBox = Number(item.cansPerBox) || 1;
      return (boxes * perBox) + loose;
    };

    // Helper: format currency
    const fmt = (num, sym = "₹") => {
      const n = Number(num) || 0;
      return `${sym}${n.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      // Data state with LocalStorage
      const [settings, setSettings] = useState(() => {
        try {
          const saved = localStorage.getItem('gm_settings');
          return saved ? JSON.parse(saved) : DEFAULT_SETTINGS;
        } catch (e) {
          return DEFAULT_SETTINGS;
        }
      });

      const [inventory, setInventory] = useState(() => {
        try {
          const saved = localStorage.getItem('gm_inventory');
          return saved ? JSON.parse(saved) : INITIAL_INVENTORY;
        } catch (e) {
          return INITIAL_INVENTORY;
        }
      });

      const [invoices, setInvoices] = useState(() => {
        try {
          const saved = localStorage.getItem('gm_invoices');
          return saved ? JSON.parse(saved) : INITIAL_INVOICES;
        } catch (e) {
          return INITIAL_INVOICES;
        }
      });

      const [returns, setReturns] = useState(() => {
        try {
          const saved = localStorage.getItem('gm_returns');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      // Navigation: 'dashboard' | 'inventory' | 'billing' | 'records' | 'returns' | 'alerts' | 'settings'
      const [currentTab, setCurrentTab] = useState('dashboard');

      // UI Feedback
      const [toast, setToast] = useState(null);
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3200);
      };

      // Modals
      const [itemModal, setItemModal] = useState({ open: false, mode: 'add', item: null });
      const [quickStockModal, setQuickStockModal] = useState({ open: false, item: null });
      const [viewInvoiceModal, setViewInvoiceModal] = useState({ open: false, invoice: null });
      const [confirmDialog, setConfirmDialog] = useState(null);

      // Persistence
      useEffect(() => {
        try {
          localStorage.setItem('gm_settings', JSON.stringify(settings));
        } catch(e) {}
      }, [settings]);

      useEffect(() => {
        try {
          localStorage.setItem('gm_inventory', JSON.stringify(inventory));
        } catch(e) {}
      }, [inventory]);

      useEffect(() => {
        try {
          localStorage.setItem('gm_invoices', JSON.stringify(invoices));
        } catch(e) {}
      }, [invoices]);

      useEffect(() => {
        try {
          localStorage.setItem('gm_returns', JSON.stringify(returns));
        } catch(e) {}
      }, [returns]);

      // Android back button integration
      useEffect(() => {
        window.handleAndroidBack = () => {
          if (viewInvoiceModal.open) {
            setViewInvoiceModal({ open: false, invoice: null });
            return true;
          }
          if (itemModal.open) {
            setItemModal({ open: false, mode: 'add', item: null });
            return true;
          }
          if (quickStockModal.open) {
            setQuickStockModal({ open: false, item: null });
            return true;
          }
          if (confirmDialog) {
            setConfirmDialog(null);
            return true;
          }
          if (currentTab !== 'dashboard') {
            setCurrentTab('dashboard');
            return true;
          }
          return false;
        };
      }, [viewInvoiceModal, itemModal, quickStockModal, confirmDialog, currentTab]);

      // Stock summary calculations
      const stockStats = useMemo(() => {
        let totalItems = inventory.length;
        let totalUnits = 0;
        let outOfStockCount = 0;
        let criticalStockCount = 0;
        let lowStockCount = 0;

        inventory.forEach(item => {
          const qty = calcStock(item);
          totalUnits += qty;
          const thresh = Number(item.lowStockThreshold) || Number(settings.lowStockThreshold) || 5;
          if (qty === 0) {
            outOfStockCount++;
          } else if (qty <= 2) {
            criticalStockCount++;
          } else if (qty <= thresh) {
            lowStockCount++;
          }
        });

        const totalAlerts = outOfStockCount + criticalStockCount + lowStockCount;

        // Today's sales
        const todayStr = new Date().toISOString().split('T')[0];
        let todaySales = 0;
        let todayInvoiceCount = 0;
        invoices.forEach(inv => {
          if (inv.date === todayStr) {
            todaySales += Number(inv.grandTotal) || 0;
            todayInvoiceCount++;
          }
        });

        let totalReturnsVal = returns.reduce((acc, r) => acc + (Number(r.totalRefund) || 0), 0);

        return {
          totalItems,
          totalUnits,
          outOfStockCount,
          criticalStockCount,
          lowStockCount,
          totalAlerts,
          todaySales,
          todayInvoiceCount,
          totalReturnsVal
        };
      }, [inventory, invoices, returns, settings.lowStockThreshold]);

      // Trigger Print
      const handlePrintInvoice = (inv) => {
        setViewInvoiceModal({ open: true, invoice: inv });
        setTimeout(() => {
          if (window.AndroidBridge && window.AndroidBridge.printInvoice) {
            window.AndroidBridge.printInvoice();
          } else {
            window.print();
          }
        }, 300);
      };

      return (
        <div class="min-h-screen flex flex-col bg-slate-950 text-slate-100 pb-20 md:pb-6">
          {/* Top Header */}
          <header class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-brand-600 to-sky-400 flex items-center justify-center shadow-lg shadow-brand-500/20">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
              </div>
              <div>
                <h1 class="text-base md:text-lg font-bold text-white tracking-tight flex items-center gap-2">
                  {settings.storeName}
                  <span class="text-[10px] uppercase font-semibold bg-brand-500/20 text-brand-300 px-1.5 py-0.5 rounded border border-brand-500/30">POS</span>
                </h1>
                <p class="text-xs text-slate-400 hidden sm:block truncate max-w-sm">{settings.tagline}</p>
              </div>
            </div>

            {/* Header Right Actions */}
            <div class="flex items-center space-x-2">
              <button
                onClick={() => setCurrentTab('billing')}
                class="px-3 py-1.5 bg-brand-600 hover:bg-brand-500 text-white rounded-lg text-xs md:text-sm font-semibold flex items-center gap-1.5 shadow-md shadow-brand-600/30 transition active:scale-95"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />
                </svg>
                <span>New Bill</span>
              </button>

              <button
                onClick={() => setCurrentTab('alerts')}
                class="relative p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition"
                title="Stock Alerts"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                </svg>
                {stockStats.totalAlerts > 0 && (
                  <span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center animate-pulse">
                    {stockStats.totalAlerts}
                  </span>
                )}
              </button>
            </div>
          </header>

          {/* Toast Notification */}
          {toast && (
            <div class={`fixed top-16 right-4 left-4 md:left-auto md:w-80 z-50 p-3.5 rounded-xl shadow-2xl flex items-center gap-3 transition-all duration-300 text-sm font-medium ${
              toast.type === 'error' ? 'bg-rose-900/90 border border-rose-700 text-rose-100' :
              toast.type === 'warning' ? 'bg-amber-900/90 border border-amber-700 text-amber-100' :
              'bg-emerald-900/90 border border-emerald-700 text-emerald-100'
            }`}>
              <span class="text-lg">
                {toast.type === 'error' ? '⚠️' : toast.type === 'warning' ? '⚡' : '✅'}
              </span>
              <p class="flex-1">{toast.message}</p>
            </div>
          )}

          {/* Main Content Area */}
          <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-5">
            {currentTab === 'dashboard' && (
              <DashboardView
                stats={stockStats}
                inventory={inventory}
                invoices={invoices}
                returns={returns}
                settings={settings}
                setTab={setCurrentTab}
                openAddModal={() => setItemModal({ open: true, mode: 'add', item: null })}
                onViewInvoice={(inv) => setViewInvoiceModal({ open: true, invoice: inv })}
                onPrintInvoice={handlePrintInvoice}
              />
            )}

            {currentTab === 'inventory' && (
              <InventoryView
                inventory={inventory}
                setInventory={setInventory}
                settings={settings}
                showToast={showToast}
                openAddModal={() => setItemModal({ open: true, mode: 'add', item: null })}
                openEditModal={(item) => setItemModal({ open: true, mode: 'edit', item })}
                openQuickStock={(item) => setQuickStockModal({ open: true, item })}
                confirmDialog={setConfirmDialog}
              />
            )}

            {currentTab === 'billing' && (
              <BillingView
                inventory={inventory}
                setInventory={setInventory}
                invoices={invoices}
                setInvoices={setInvoices}
                settings={settings}
                showToast={showToast}
                onBillSuccess={(newInv) => {
                  setViewInvoiceModal({ open: true, invoice: newInv });
                }}
              />
            )}

            {currentTab === 'records' && (
              <SalesRecordsView
                invoices={invoices}
                settings={settings}
                onViewInvoice={(inv) => setViewInvoiceModal({ open: true, invoice: inv })}
                onPrintInvoice={handlePrintInvoice}
                onInitiateReturn={(inv) => {
                  setCurrentTab('returns');
                }}
              />
            )}

            {currentTab === 'returns' && (
              <ReturnsView
                invoices={invoices}
                setInvoices={setInvoices}
                returns={returns}
                setReturns={setReturns}
                inventory={inventory}
                setInventory={setInventory}
                settings={settings}
                showToast={showToast}
                confirmDialog={setConfirmDialog}
              />
            )}

            {currentTab === 'alerts' && (
              <StockAlertsView
                inventory={inventory}
                settings={settings}
                openQuickStock={(item) => setQuickStockModal({ open: true, item })}
                openEditModal={(item) => setItemModal({ open: true, mode: 'edit', item })}
              />
            )}

            {currentTab === 'settings' && (
              <SettingsView
                settings={settings}
                setSettings={setSettings}
                inventory={inventory}
                setInventory={setInventory}
                invoices={invoices}
                setInvoices={setInvoices}
                returns={returns}
                setReturns={setReturns}
                showToast={showToast}
                confirmDialog={setConfirmDialog}
              />
            )}
          </main>

          {/* Navigation Bar: Bottom Navigation for Mobile & Responsive Desktop Tabs */}
          <nav class="fixed bottom-0 left-0 right-0 z-30 bg-slate-900 border-t border-slate-800 px-2 py-1 flex justify-around items-center md:static md:mt-auto md:border-t-0 md:bg-transparent md:max-w-7xl md:mx-auto md:px-5">
            <button
              onClick={() => setCurrentTab('dashboard')}
              class={`flex flex-col items-center py-1.5 px-2.5 rounded-xl transition ${
                currentTab === 'dashboard' ? 'text-brand-400 font-bold' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
              </svg>
              <span class="text-[11px]">Dashboard</span>
            </button>

            <button
              onClick={() => setCurrentTab('inventory')}
              class={`flex flex-col items-center py-1.5 px-2.5 rounded-xl transition ${
                currentTab === 'inventory' ? 'text-brand-400 font-bold' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
              </svg>
              <span class="text-[11px]">Inventory</span>
            </button>

            <button
              onClick={() => setCurrentTab('billing')}
              class={`flex flex-col items-center py-1.5 px-3 rounded-xl transition ${
                currentTab === 'billing' ? 'text-brand-400 font-bold bg-brand-500/10' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <div class="relative">
                <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                </svg>
              </div>
              <span class="text-[11px]">Billing POS</span>
            </button>

            <button
              onClick={() => setCurrentTab('records')}
              class={`flex flex-col items-center py-1.5 px-2.5 rounded-xl transition ${
                currentTab === 'records' ? 'text-brand-400 font-bold' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
              </svg>
              <span class="text-[11px]">Records</span>
            </button>

            <button
              onClick={() => setCurrentTab('returns')}
              class={`flex flex-col items-center py-1.5 px-2.5 rounded-xl transition ${
                currentTab === 'returns' ? 'text-brand-400 font-bold' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 15v-1a4 4 0 00-4-4H4m0 0l4 4m-4-4l4-4m12 12V9a4 4 0 00-4-4h-2" />
              </svg>
              <span class="text-[11px]">Returns</span>
            </button>

            <button
              onClick={() => setCurrentTab('settings')}
              class={`flex flex-col items-center py-1.5 px-2.5 rounded-xl transition ${
                currentTab === 'settings' ? 'text-brand-400 font-bold' : 'text-slate-400 hover:text-slate-200'
              }`}
            >
              <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <span class="text-[11px]">Settings</span>
            </button>
          </nav>

          {/* MODALS */}
          {itemModal.open && (
            <ItemEditModal
              mode={itemModal.mode}
              item={itemModal.item}
              settings={settings}
              onClose={() => setItemModal({ open: false, mode: 'add', item: null })}
              onSave={(savedItem) => {
                if (itemModal.mode === 'add') {
                  setInventory(prev => [savedItem, ...prev]);
                  showToast(`Added ${savedItem.name} to inventory`);
                } else {
                  setInventory(prev => prev.map(p => p.id === savedItem.id ? savedItem : p));
                  showToast(`Updated ${savedItem.name}`);
                }
                setItemModal({ open: false, mode: 'add', item: null });
              }}
            />
          )}

          {quickStockModal.open && (
            <QuickStockModal
              item={quickStockModal.item}
              onClose={() => setQuickStockModal({ open: false, item: null })}
              onSave={(addBoxes, addLoose, note) => {
                const target = quickStockModal.item;
                const newBoxes = (Number(target.boxes) || 0) + Number(addBoxes);
                const newLoose = (Number(target.looseCans) || 0) + Number(addLoose);
                setInventory(prev => prev.map(p => p.id === target.id ? { ...p, boxes: newBoxes, looseCans: newLoose } : p));
                showToast(`Restocked ${target.name}: +${addBoxes} boxes, +${addLoose} loose cans`);
                setQuickStockModal({ open: false, item: null });
              }}
            />
          )}

          {viewInvoiceModal.open && (
            <InvoiceModal
              invoice={viewInvoiceModal.invoice}
              settings={settings}
              onClose={() => setViewInvoiceModal({ open: false, invoice: null })}
              onPrint={() => handlePrintInvoice(viewInvoiceModal.invoice)}
            />
          )}

          {confirmDialog && (
            <ConfirmModal
              title={confirmDialog.title}
              message={confirmDialog.message}
              confirmLabel={confirmDialog.confirmLabel}
              confirmClass={confirmDialog.confirmClass}
              onConfirm={() => {
                confirmDialog.onConfirm();
                setConfirmDialog(null);
              }}
              onCancel={() => setConfirmDialog(null)}
            />
          )}
        </div>
      );
    }

    // --- 4. SALES RECORDS VIEW ---
    function SalesRecordsView({ invoices, settings, onViewInvoice, onPrintInvoice, onInitiateReturn }) {
      const sym = settings.currency || "₹";
      const [searchQuery, setSearchQuery] = useState("");
      const [dateFilter, setDateFilter] = useState("all");
      const [paymentFilter, setPaymentFilter] = useState("all");

      const filteredInvoices = useMemo(() => {
        const today = new Date().toISOString().split('T')[0];
        return invoices.filter(inv => {
          const matchSearch =
            !searchQuery ||
            inv.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
            (inv.customer?.name && inv.customer.name.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (inv.customer?.phone && inv.customer.phone.includes(searchQuery));

          let matchDate = true;
          if (dateFilter === 'today') {
            matchDate = inv.date === today;
          } else if (dateFilter === 'month') {
            matchDate = inv.date.startsWith(today.substring(0, 7));
          }

          const matchPayment = paymentFilter === 'all' || inv.paymentMethod?.toLowerCase() === paymentFilter.toLowerCase();

          return matchSearch && matchDate && matchPayment;
        });
      }, [invoices, searchQuery, dateFilter, paymentFilter]);

      const summary = useMemo(() => {
        const totalSales = filteredInvoices.reduce((acc, i) => acc + (Number(i.grandTotal) || 0), 0);
        const totalDiscounts = filteredInvoices.reduce((acc, i) => acc + (Number(i.overallDiscount) || 0), 0);
        return { totalSales, totalDiscounts, count: filteredInvoices.length };
      }, [filteredInvoices]);

      return (
        <div class="space-y-4">
          {/* Summary Strip */}
          <div class="grid grid-cols-3 gap-3 bg-slate-900 border border-slate-800 p-4 rounded-2xl">
            <div>
              <p class="text-[11px] font-semibold text-slate-400 uppercase">Filtered Invoices</p>
              <p class="text-xl sm:text-2xl font-extrabold text-white mt-0.5">{summary.count}</p>
            </div>
            <div>
              <p class="text-[11px] font-semibold text-slate-400 uppercase">Total Sales</p>
              <p class="text-xl sm:text-2xl font-extrabold text-emerald-400 mt-0.5">{fmt(summary.totalSales, sym)}</p>
            </div>
            <div>
              <p class="text-[11px] font-semibold text-slate-400 uppercase">Discounts Given</p>
              <p class="text-xl sm:text-2xl font-extrabold text-amber-400 mt-0.5">{fmt(summary.totalDiscounts, sym)}</p>
            </div>
          </div>

          {/* Filters Bar */}
          <div class="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl flex flex-col sm:flex-row gap-2.5">
            <div class="relative flex-1">
              <svg class="w-4 h-4 absolute left-3 top-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              <input
                type="text"
                placeholder="Search invoice number, customer name, phone..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-9 pr-3 py-2 text-xs text-white focus:outline-none focus:ring-1 focus:ring-brand-500"
              />
            </div>

            <div class="flex gap-2">
              <select
                value={dateFilter}
                onChange={e => setDateFilter(e.target.value)}
                class="bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none"
              >
                <option value="all">All Dates</option>
                <option value="today">Today Only</option>
                <option value="month">This Month</option>
              </select>

              <select
                value={paymentFilter}
                onChange={e => setPaymentFilter(e.target.value)}
                class="bg-slate-800 border border-slate-700 rounded-xl px-2.5 py-2 text-xs text-white focus:outline-none"
              >
                <option value="all">All Modes</option>
                <option value="cash">Cash</option>
                <option value="upi">UPI</option>
                <option value="card">Card</option>
                <option value="credit">Credit</option>
              </select>
            </div>
          </div>

          {/* Invoices List */}
          {filteredInvoices.length === 0 ? (
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-10 text-center text-slate-500">
              <p class="text-sm">No sales records found.</p>
            </div>
          ) : (
            <div class="space-y-3">
              {filteredInvoices.map(inv => (
                <div
                  key={inv.id}
                  class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 transition"
                >
                  <div class="flex-1">
                    <div class="flex items-center gap-2">
                      <span class="font-mono text-sm font-bold text-brand-400">{inv.id}</span>
                      <span class="text-xs text-slate-400 font-medium">• {inv.date} {inv.time}</span>
                      <span class={`text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${
                        inv.status === 'Completed' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'
                      }`}>
                        {inv.status || 'Completed'}
                      </span>
                    </div>

                    <div class="mt-1">
                      <p class="text-sm font-semibold text-white">
                        {inv.customer?.name || "Walk-in Customer"}
                        {inv.customer?.phone && <span class="text-slate-400 text-xs ml-2">({inv.customer.phone})</span>}
                      </p>
                      <p class="text-xs text-slate-400 mt-0.5">
                        {inv.items?.length || 0} product line(s) • Total Units: {inv.items?.reduce((a, b) => a + (b.totalUnits || b.qty), 0)}
                      </p>
                    </div>
                  </div>

                  <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto gap-4 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-800">
                    <div class="text-left sm:text-right">
                      <p class="text-base font-extrabold text-emerald-400">{fmt(inv.grandTotal, sym)}</p>
                      <span class="text-[11px] font-medium text-slate-400 uppercase bg-slate-800 px-2 py-0.5 rounded">
                        {inv.paymentMethod}
                      </span>
                    </div>

                    <div class="flex items-center gap-1.5">
                      <button
                        onClick={() => onViewInvoice(inv)}
                        class="px-3 py-1.5 bg-slate-800 hover:bg-slate-750 text-slate-200 rounded-lg text-xs font-semibold transition"
                      >
                        View
                      </button>
                      <button
                        onClick={() => onPrintInvoice(inv)}
                        class="px-3 py-1.5 bg-brand-600/20 hover:bg-brand-600/30 text-brand-400 rounded-lg text-xs font-semibold transition"
                      >
                        Print
                      </button>
                      <button
                        onClick={() => onInitiateReturn(inv)}
                        class="px-2.5 py-1.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 rounded-lg text-xs font-semibold transition"
                        title="Process Return"
                      >
                        Return
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // --- 5. RETURNS & REFUNDS VIEW ---
    function ReturnsView({ invoices, setInvoices, returns, setReturns, inventory, setInventory, settings, showToast, confirmDialog }) {
      const sym = settings.currency || "₹";
      const [selectedInvoiceId, setSelectedInvoiceId] = useState("");
      const [returnItems, setReturnItems] = useState({}); // { [itemId]: { qty, refundPerUnit, restock } }
      const [returnReason, setReturnReason] = useState("Customer returned excess unopened paint");

      const selectedInvoice = useMemo(() => {
        return invoices.find(inv => inv.id === selectedInvoiceId);
      }, [invoices, selectedInvoiceId]);

      // When invoice changes, initialize return selections
      useEffect(() => {
        if (selectedInvoice) {
          const init = {};
          selectedInvoice.items?.forEach(item => {
            // Check how many already returned for this item in this invoice
            const alreadyReturned = returns
              .filter(r => r.invoiceId === selectedInvoice.id)
              .reduce((acc, r) => {
                const found = r.items?.find(ri => ri.itemId === item.id);
                return acc + (found ? Number(found.qtyReturned) : 0);
              }, 0);

            const maxReturnable = Math.max(0, (item.totalUnits || item.qty) - alreadyReturned);

            init[item.id] = {
              name: item.name,
              maxReturnable: maxReturnable,
              qtyToReturn: 0,
              unitRate: (item.total / (item.totalUnits || item.qty)),
              restock: true
            };
          });
          setReturnItems(init);
        } else {
          setReturnItems({});
        }
      }, [selectedInvoice, returns]);

      const totalRefundAmount = useMemo(() => {
        let total = 0;
        Object.values(returnItems).forEach(ri => {
          total += (Number(ri.qtyToReturn) || 0) * (Number(ri.unitRate) || 0);
        });
        return Math.round(total);
      }, [returnItems]);

      const handleProcessReturn = () => {
        const itemsToReturn = Object.entries(returnItems)
          .filter(([_, val]) => Number(val.qtyToReturn) > 0)
          .map(([itemId, val]) => ({
            itemId,
            name: val.name,
            qtyReturned: Number(val.qtyToReturn),
            refundAmount: Math.round(Number(val.qtyToReturn) * Number(val.unitRate)),
            restocked: val.restock
          }));

        if (itemsToReturn.length === 0) {
          showToast("Please enter quantity to return for at least one item", "warning");
          return;
        }

        confirmDialog({
          title: "Confirm Sales Return",
          message: `Process return for ${itemsToReturn.length} item(s) with total refund of ${fmt(totalRefundAmount, sym)}?`,
          confirmLabel: "Confirm Return & Refund",
          confirmClass: "bg-amber-600 hover:bg-amber-500",
          onConfirm: () => {
            // Restore inventory if restock is enabled
            const newInventory = [...inventory];
            itemsToReturn.forEach(retItem => {
              if (retItem.restocked) {
                const pIdx = newInventory.findIndex(p => p.id === retItem.itemId);
                if (pIdx !== -1) {
                  const p = { ...newInventory[pIdx] };
                  p.looseCans = (Number(p.looseCans) || 0) + retItem.qtyReturned;
                  newInventory[pIdx] = p;
                }
              }
            });
            setInventory(newInventory);

            // Record return entry
            const newReturn = {
              id: `RET-${Date.now().toString().slice(-6)}`,
              returnDate: new Date().toISOString().split('T')[0],
              returnTime: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              invoiceId: selectedInvoice.id,
              customerName: selectedInvoice.customer?.name || "Customer",
              items: itemsToReturn,
              totalRefund: totalRefundAmount,
              reason: returnReason
            };

            setReturns(prev => [newReturn, ...prev]);

            // Update invoice status
            setInvoices(prev => prev.map(inv =>
              inv.id === selectedInvoice.id ? { ...inv, status: "Partially Returned" } : inv
            ));

            showToast(`Processed Return #${newReturn.id} (${fmt(totalRefundAmount, sym)})`, 'success');
            setSelectedInvoiceId("");
          }
        });
      };

      return (
        <div class="space-y-6">
          {/* Header */}
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
            <h2 class="text-base font-bold text-white">Sales Return & Restocking</h2>
            <p class="text-xs text-slate-400">Select an existing invoice to process partial or full returns</p>

            {/* Select Invoice */}
            <div class="mt-3">
              <label class="block text-xs font-semibold text-slate-300 mb-1">Select Invoice</label>
              <select
                value={selectedInvoiceId}
                onChange={e => setSelectedInvoiceId(e.target.value)}
                class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:ring-1 focus:ring-brand-500"
              >
                <option value="">-- Choose an Invoice to Return Items --</option>
                {invoices.map(inv => (
                  <option key={inv.id} value={inv.id}>
                    {inv.id} - {inv.customer?.name || "Walk-in"} ({inv.date}) - {fmt(inv.grandTotal, sym)}
                  </option>
                ))}
              </select>
            </div>
          </div>

          {/* Invoice Return Form */}
          {selectedInvoice && (
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-4">
              <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div>
                  <h3 class="text-sm font-bold text-white">{selectedInvoice.customer?.name}</h3>
                  <p class="text-xs text-slate-400">Invoice #{selectedInvoice.id} • Date: {selectedInvoice.date}</p>
                </div>
                <div class="text-right">
                  <p class="text-xs text-slate-400">Invoice Total</p>
                  <p class="text-sm font-bold text-emerald-400">{fmt(selectedInvoice.grandTotal, sym)}</p>
                </div>
              </div>

              {/* Items in this invoice */}
              <div class="space-y-2.5">
                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400">Select Items to Return</h4>
                {selectedInvoice.items?.map(item => {
                  const state = returnItems[item.id] || { maxReturnable: 0, qtyToReturn: 0, restock: true };
                  return (
                    <div key={item.id} class="bg-slate-850 p-3 rounded-xl border border-slate-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                      <div class="flex-1">
                        <p class="text-xs font-bold text-white">{item.name}</p>
                        <p class="text-[11px] text-slate-400">
                          Purchased: {item.totalUnits || item.qty} units • Rate: {fmt(item.rate, sym)}
                        </p>
                        <p class="text-[11px] text-sky-400 font-medium">
                          Remaining Returnable: {state.maxReturnable} units
                        </p>
                      </div>

                      <div class="flex items-center gap-3">
                        <div class="flex items-center gap-1.5">
                          <label class="text-xs text-slate-400">Return Qty:</label>
                          <input
                            type="number"
                            min="0"
                            max={state.maxReturnable}
                            value={state.qtyToReturn || ""}
                            onChange={e => {
                              const val = Math.min(state.maxReturnable, Math.max(0, Number(e.target.value) || 0));
                              setReturnItems(prev => ({
                                ...prev,
                                [item.id]: { ...prev[item.id], qtyToReturn: val }
                              }));
                            }}
                            class="w-16 bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-white text-center"
                          />
                        </div>

                        <label class="flex items-center gap-1 text-[11px] text-slate-300 cursor-pointer">
                          <input
                            type="checkbox"
                            checked={state.restock}
                            onChange={e => {
                              setReturnItems(prev => ({
                                ...prev,
                                [item.id]: { ...prev[item.id], restock: e.target.checked }
                              }));
                            }}
                            class="rounded bg-slate-800 border-slate-700 text-brand-500"
                          />
                          <span>Restore Stock</span>
                        </label>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Return Reason & Action */}
              <div class="border-t border-slate-800 pt-3 space-y-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-400 mb-1">Reason for Return</label>
                  <input
                    type="text"
                    value={returnReason}
                    onChange={e => setReturnReason(e.target.value)}
                    placeholder="e.g. Paint shade mismatched / excess unopened cans"
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                  />
                </div>

                <div class="flex items-center justify-between pt-2">
                  <div>
                    <span class="text-xs text-slate-400">Total Refund Amount:</span>
                    <p class="text-lg font-extrabold text-amber-400">{fmt(totalRefundAmount, sym)}</p>
                  </div>

                  <button
                    disabled={totalRefundAmount <= 0}
                    onClick={handleProcessReturn}
                    class="px-5 py-2.5 bg-amber-600 hover:bg-amber-500 disabled:bg-slate-800 disabled:text-slate-600 text-white rounded-xl text-xs font-bold shadow-md shadow-amber-600/30 transition active:scale-95"
                  >
                    Confirm & Refund
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Past Returns History */}
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
            <h3 class="text-sm font-bold text-white mb-3">Return History Log</h3>
            {returns.length === 0 ? (
              <p class="text-xs text-slate-500 py-4 text-center">No sales returns recorded yet.</p>
            ) : (
              <div class="space-y-2.5">
                {returns.map(ret => (
                  <div key={ret.id} class="bg-slate-850 p-3 rounded-xl border border-slate-800 text-xs">
                    <div class="flex justify-between items-start">
                      <div>
                        <span class="font-mono font-bold text-amber-400">{ret.id}</span>
                        <span class="text-slate-400 ml-2">Invoice: {ret.invoiceId}</span>
                        <p class="font-semibold text-white mt-0.5">{ret.customerName}</p>
                      </div>
                      <div class="text-right">
                        <p class="font-extrabold text-rose-400">{fmt(ret.totalRefund, sym)}</p>
                        <p class="text-[10px] text-slate-400">{ret.returnDate}</p>
                      </div>
                    </div>
                    <p class="text-[11px] text-slate-400 mt-1 italic">Reason: {ret.reason}</p>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- 6. STOCK ALERTS VIEW ---
    function StockAlertsView({ inventory, settings, openQuickStock, openEditModal }) {
      const sym = settings.currency || "₹";
      const [filterTab, setFilterTab] = useState("all"); // 'all' | 'out' | 'critical' | 'low'

      const alerts = useMemo(() => {
        return inventory.map(item => {
          const totalUnits = calcStock(item);
          const threshold = Number(item.lowStockThreshold) || Number(settings.lowStockThreshold) || 5;
          let status = 'normal';
          if (totalUnits === 0) status = 'out';
          else if (totalUnits <= 2) status = 'critical';
          else if (totalUnits <= threshold) status = 'low';

          return { ...item, totalUnits, threshold, status };
        }).filter(item => item.status !== 'normal')
          .filter(item => filterTab === 'all' || item.status === filterTab);
      }, [inventory, settings.lowStockThreshold, filterTab]);

      return (
        <div class="space-y-4">
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
            <h2 class="text-base font-bold text-white flex items-center gap-2">
              <span>Stock Alerts & Reordering</span>
              <span class="text-xs bg-rose-500/20 text-rose-400 px-2 py-0.5 rounded-full font-bold">
                {alerts.length} item(s) require attention
              </span>
            </h2>
            <p class="text-xs text-slate-400 mt-1">
              Low-stock items below threshold ({settings.lowStockThreshold} units). Restock directly with one click.
            </p>

            {/* Filter Pills */}
            <div class="flex gap-2 mt-3 overflow-x-auto no-scrollbar">
              {[
                { id: 'all', label: 'All Alerts' },
                { id: 'out', label: 'Out of Stock (0)' },
                { id: 'critical', label: 'Critical (<=2)' },
                { id: 'low', label: 'Low Stock' },
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setFilterTab(tab.id)}
                  class={`px-3 py-1.5 rounded-xl text-xs font-semibold border transition ${
                    filterTab === tab.id
                      ? 'bg-brand-600 text-white border-brand-500 shadow-sm'
                      : 'bg-slate-800 text-slate-400 border-slate-700 hover:text-white'
                  }`}
                >

    // --- 7. SETTINGS & DATA SAFETY VIEW ---
    function SettingsView({ settings, setSettings, inventory, setInventory, invoices, setInvoices, returns, setReturns, showToast, confirmDialog }) {
      const [form, setForm] = useState({ ...settings });
      const fileInputRef = useRef(null);

      const handleSave = (e) => {
        e.preventDefault();
        setSettings(form);
        showToast("Settings saved successfully!", "success");
      };

      // Export JSON
      const handleExportData = () => {
        const fullBackup = {
          exportDate: new Date().toISOString(),
          version: "1.0",
          settings: form,
          inventory,
          invoices,
          returns
        };
        const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `GoodsManage_Backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("Data exported successfully!");
      };

      // Import JSON
      const handleImportFile = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.inventory && Array.isArray(data.inventory)) {
              confirmDialog({
                title: "Import Application Data?",
                message: `Found ${data.inventory.length} inventory items, ${data.invoices?.length || 0} invoices, and store settings in backup. Do you want to restore this data?`,
                confirmLabel: "Restore Data",
                confirmClass: "bg-brand-600 hover:bg-brand-500",
                onConfirm: () => {
                  if (data.settings) {
                    setSettings(data.settings);
                    setForm(data.settings);
                  }
                  if (data.inventory) setInventory(data.inventory);
                  if (data.invoices) setInvoices(data.invoices);
                  if (data.returns) setReturns(data.returns);
                  showToast("Data restored successfully!", "success");
                }
              });
            } else {
              showToast("Invalid backup file format", "error");
            }
          } catch (err) {
            showToast("Failed to parse JSON file", "error");
          }
        };
        reader.readAsText(file);
      };

      // Reset to Sample Data
      const handleResetSample = () => {
        confirmDialog({
          title: "Reset to Sample Data?",
          message: "This will replace your current inventory with standard paint & hardware products (Asian Paints, Berger, Astral, etc.).",
          confirmLabel: "Load Sample Data",
          confirmClass: "bg-sky-600 hover:bg-sky-500",
          onConfirm: () => {
            setInventory(INITIAL_INVENTORY);
            setSettings(DEFAULT_SETTINGS);
            setForm(DEFAULT_SETTINGS);
            showToast("Sample data loaded");
          }
        });
      };

      // Clear All Data
      const handleClearAll = () => {
        confirmDialog({
          title: "CLEAR ALL DATA?",
          message: "Warning: This will permanently delete all inventory, invoices, and return records from this device. Please export a backup first!",
          confirmLabel: "Yes, Delete Everything",
          confirmClass: "bg-rose-600 hover:bg-rose-500",
          onConfirm: () => {
            setInventory([]);
            setInvoices([]);
            setReturns([]);
            localStorage.clear();
            showToast("All data cleared", "warning");
          }
        });
      };

      return (
        <div class="max-w-4xl mx-auto space-y-6">
          {/* Store Settings Form */}
          <form onSubmit={handleSave} class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
            <h2 class="text-base font-bold text-white flex items-center gap-2">
              <svg class="w-5 h-5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
              <span>Store Profile & Invoice Header</span>
            </h2>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 text-xs">
              <div>
                <label class="block font-semibold text-slate-300 mb-1">Store / Business Name *</label>
                <input
                  type="text"
                  required
                  value={form.storeName}
                  onChange={e => setForm({ ...form, storeName: e.target.value })}
                  class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:ring-1 focus:ring-brand-500"
                />
              </div>

              <div>
                <label class="block font-semibold text-slate-300 mb-1">Store Tagline / Dealerships</label>
                <input
                  type="text"
                  value={form.tagline}
                  onChange={e => setForm({ ...form, tagline: e.target.value })}
                  class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none"
                />
              </div>

              <div class="sm:col-span-2">
                <label class="block font-semibold text-slate-300 mb-1">Store Address *</label>
                <input
                  type="text"
                  required
                  value={form.address}
                  onChange={e => setForm({ ...form, address: e.target.value })}
                  class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none"
                />
              </div>

              <div>
                <label class="block font-semibold text-slate-300 mb-1">City, State & Pincode</label>
                <input
                  type="text"
                  value={form.cityState}
                  onChange={e => setForm({ ...form, cityState: e.target.value })}
                  class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none"

              </div>

              <div>
                <label class="block font-semibold text-slate-300 mb-1">GSTIN Number (for Tax Invoices)</label>
                <input
                  type="text"
                  value={form.gstin}
                  onChange={e => setForm({ ...form, gstin: e.target.value })}
                  class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white uppercase focus:outline-none"
                />
              </div>

              <div>
                <label class="block font-semibold text-slate-300 mb-1">Phone Number *</label>
                <input
                  type="text"
                  required
                  value={form.phone}
                  onChange={e => setForm({ ...form, phone: e.target.value })}
                  class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none"
                />
              </div>

              <div>
                <label class="block font-semibold text-slate-300 mb-1">Owner / Contact Person</label>
                <input
                  type="text"
                  value={form.ownerName}
                  onChange={e => setForm({ ...form, ownerName: e.target.value })}
                  class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none"
                />
              </div>

              <div>
                <label class="block font-semibold text-slate-300 mb-1">Default Low Stock Alert Threshold</label>
                <input
                  type="number"
                  min="1"
                  value={form.lowStockThreshold}
                  onChange={e => setForm({ ...form, lowStockThreshold: Number(e.target.value) })}
                  class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none"
                />
              </div>

              <div>
                <label class="block font-semibold text-slate-300 mb-1">Currency Symbol</label>
                <input
                  type="text"
                  value={form.currency}
                  onChange={e => setForm({ ...form, currency: e.target.value })}
                  class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none"
                />
              </div>

              <div class="sm:col-span-2">
                <label class="block font-semibold text-slate-300 mb-1">Invoice Footer / Terms & Conditions</label>
                <textarea
                  rows="2"
                  value={form.footerNote}
                  onChange={e => setForm({ ...form, footerNote: e.target.value })}
                  class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none"
                ></textarea>
              </div>
            </div>

            <div class="flex justify-end pt-2">
              <button
                type="submit"
                class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-bold shadow-md shadow-brand-600/30 transition active:scale-95"
              >
                Save Settings
              </button>
            </div>
          </form>

          {/* Data Safety & Backup Section */}
          <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
            <h2 class="text-base font-bold text-white flex items-center gap-2">
              <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
              <span>Data Backup & Safety</span>
            </h2>
            <p class="text-xs text-slate-400">
              Your data is stored locally in your browser/device. Export regular JSON backups to keep your sales and inventory safe.
            </p>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
              <button
                type="button"
                onClick={handleExportData}
                class="p-3.5 bg-slate-800 hover:bg-slate-750 border border-slate-700 rounded-xl flex items-center gap-3 transition"
              >
                <div class="p-2 bg-emerald-500/10 text-emerald-400 rounded-lg">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                </div>
                <div class="text-left">
                  <p class="text-xs font-bold text-white">Export All Data (JSON)</p>

              <button
